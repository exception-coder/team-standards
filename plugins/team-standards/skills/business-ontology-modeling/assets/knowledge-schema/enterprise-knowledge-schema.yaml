relations:
  belongsTo: owner domain/context; never inferred from a directory alone
  hasPart: explicit composition; cardinality must be evidenced
  hasAttribute: business entity to attribute definition
  hasState: entity to state definition
  transitionsTo: state transition with rule/evidence references
  emits: activity or capability to business event
  participatesIn: actor to activity or process
  governedBy: entity/activity to rule or policy
  measuredBy: entity/capability to metric
  definedBy: metric to versioned metric definition
  mapsTo: semantic object to data mapping; no identity equivalence implied
  implementedBy: capability/rule to evidenced implementation
  storedIn: object to evidenced table/column mapping
  dependsOn: directional dependency with evidence and scope
  derivedFrom: provenance relation; map to prov:wasDerivedFrom
  revises: version relation; map to prov:wasRevisionOf
  # Domain-specific relationships use a registered namespaced extension, not a renamed core type.
extensions:
  policy: Versioned explicit project extension with definition, source/target types and evidence; AI must not silently change core categories/types.
  domain_relationships: Define actual business predicates from evidence; the core relation list is not an exhaustive business ontology.
node_fields:
  required: [id, type, name, enterprise, domain, context, description, properties, relationships, business_rules, processes, data_mappings, implementation_refs, evidence_refs, verification_status, confidence]
  identity: Stable IRI or registered compact ID mapped to IRI; preserve across renames.
  scope: enterprise/domain/context are reference IDs or null; null requires a gap record, except globally scoped metadata.
  reference_arrays: [properties, relationships, business_rules, processes, data_mappings, implementation_refs, evidence_refs]
  references: Arrays contain stable IDs of separately owned records; relationships point to statements, not duplicated inline triples.
  empty_arrays: Empty means no entries recorded; coverage records distinguish not explored from searched-and-not-found or not applicable.
  confidence: Null by default; numeric values require documented method, scale, source and calibration limitations. Never substitute for evidence or acceptance.
statement_fields:
  required: [id, subject, predicate, object, basis, evidence_refs, verification_status]
  basis: [observed, inferred]
  note: Mixed-trust nodes keep per-statement status; a confirmed name does not confirm all rules or relations.
evidence_fields:
  required: [id, source_ref, source_revision, captured_at, scope, locator]
  optional: [content_hash, environment, permission_scope, query_ref, completeness, collector]
  restrictions: No credentials; database environment and snapshot freshness distinct; query truncation and inaccessible sources explicit.
status_mapping:
  CANDIDATE: candidate
  ACCEPTED: accepted
  DEPRECATED: deprecated
  acceptance: Requires referenced review with responsible actor and authorization; repeating extraction or high confidence does not accept a claim.
rdf_mapping:
  id: IRI
  type: rdf:type; local schema types require declared project namespace and mappings
  name: rdfs:label or skos:prefLabel according to node type
  description: dct:description
  classification: skos:ConceptScheme / skos:Concept with stable notation
  statement: rdf:Statement with rdf:subject / rdf:predicate / rdf:object; does not assert its business triple
  evidence_refs: prov:wasDerivedFrom
  source_ref: dct:source
  source_revision: dct:identifier
  generation: prov:wasGeneratedBy
  verification_status: kg:status via status_mapping
  basis: kg:basis
  yaml_role: Optional authoring/projection profile; choose one authoritative representation per fact, do not dual-write YAML and RDF.
coverage:
  statuses: [not_explored, partial, covered, not_found, not_applicable, blocked]
  row_fields: [scope_id, section_id, status, source_refs, artifact_refs, gaps, reason]
  context_requirement: Every discovered candidate context has all ten section IDs assessed, including inaccessible and disputed contexts.
  project_requirement: All eight project views assessed; no sample-only completion for a full-project request.
  covered: Relevant topics investigated with scoped evidence and actual output; not business approval and not just file existence.
  not_found: Scoped search performed with evidence and explicit limits; not proof of universal absence.
  not_applicable: Explanation and supporting evidence required; no automatic N/A for unknown content.
  blocked: Missing permission/source/tool; preserve gap and do not count as covered.
  reporting: Report counts per state plus unclassified assets; catalog complete, exploration complete and business accepted are separate results.
execution:
  phases: [asset_inventory, system_structure, domain_and_context_discovery, business_semantics, processes_and_rules, metrics_and_decisions, cross_domain_links, evidence_validation, unified_graph, acceptance]
  iteration: Semantics/processes/metrics run for every discovered context, not only a sample; revisit boundaries as evidence changes.
  access: Full-project scope means all authorized assets, not unlimited database rows or unauthorized cross-project access.
  completion: All scope accounted for; unresolved or blocked sections remain partial initialization, never a fabricated complete ontology.
maintenance:
  triggers: [source_change, schema_change, api_change, business_rule_change, context_split_merge, evidence_withdrawal, schema_version_change]
  rules:
    - Recheck affected statements and coverage only; retain unchanged identities and valid evidence.
    - Deletion, renamed fields, revoked permissions and conflicts invalidate dependent answers where appropriate.
    - Preserve history and replacements; do not overwrite reviewed semantics during generated observation refresh.
    - Pin schema version/hash in project manifest; upgrades require explicit mapping, not silent relabeling.
    - Legacy view IDs 01–08 keep identity; old labels are aliases, not new parallel views.
