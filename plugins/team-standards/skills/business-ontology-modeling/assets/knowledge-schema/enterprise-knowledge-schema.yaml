schema_id: urn:team-standards:enterprise-knowledge-schema
version: 1.0.0
kind: internal-engineering-contract
scope: Explicit project knowledge graph initialization and maintenance; ERP, CRM and other enterprise systems.
standards:
  representation: RDF 1.1 / Turtle
  taxonomy: SKOS ConceptScheme / Concept
  provenance: PROV-O Entity / Activity / Agent
  constraints: SHACL
  ontology: RDFS / OWL subset declared by the project; no full reasoning claim
  processes: BPMN semantics when applicable; ordinary diagrams are not executable BPMN
  decisions: DMN semantics when applicable; ordinary tables are not executable DMN
organization:
  navigation: [Enterprise, BusinessDomain, BoundedContext, ContextSection]
  optional_intermediate: Subdomain
  rules:
    - Systems and applications map to contexts; they are not business domains by default.
    - Identify boundaries from language, responsibility, invariants and evidence; menus and tables are only clues.
    - One context may span applications, and one application may contain multiple contexts.
    - Shared objects have one owner identity with references or explicit context-specific mappings, not copied definitions.
    - Unknown domain/context remains null with a knowledge gap; do not invent a boundary to fill a directory.
project_views:
  '01':
    name: Enterprise Architecture
    label: 企业与系统全景
    legacy_label: Business Architecture
    topics: [企业与组织, 业务域地图, 业务能力地图, 系统与应用地图, 业务域协作关系]
  '02':
    name: Domain Model
    label: 业务领域模型
    legacy_label: Business Ontology
    topics: [业务域, 子域, 限界上下文, 业务对象, 业务属性, 业务对象关系, 业务状态, 业务事件]
  '03':
    name: Business Process & Rules
    label: 业务流程与规则
    legacy_label: Process & Rules
    topics: [业务流程, 业务活动, 角色与参与者, 状态转换, 业务规则, 业务策略, 业务异常与边界条件]
  '04':
    name: Data Assets & Semantics
    label: 数据资产与语义
    legacy_label: Data Assets
    topics: [数据源, 数据库与Schema, 表与字段, 数据关系, 数据血缘, 数据质量, 业务对象与数据映射]
  '05':
    name: System Implementation
    label: 系统实现与能力
    legacy_label: System Capabilities
    topics: [应用与模块, 菜单与页面, API与接口, 分层实现, 核心调用链, 权限与访问控制, 系统配置, 外部系统集成]
    implementation_note: Controller/Service/Mapper are examples; preserve project-native Action/Manage/DAO or other layers.
  '06':
    name: Business Intelligence
    label: 经营指标与决策
    topics: [业务指标, 指标口径, 分析维度, 经营问题, 决策规则, 经营机会]
  '07':
    name: AI Capabilities
    label: AI能力与知识服务
    topics: [业务意图, AI工具, 技能, 业务知识检索, 业务问答能力, AI可执行操作]
  '08':
    name: Knowledge Governance
    label: 知识治理与演进
    topics: [知识来源, 证据, 置信度, 验证状态, 知识版本, 变更影响, 知识冲突, 知识缺口]
context_sections:
  '01': {name: Overview, topics: [业务目的, 职责, 边界], views: ['01', '02']}
  '02': {name: Capabilities, topics: [业务能力], views: ['01']}
  '03': {name: Ontology, topics: [对象, 属性, 关系, 事件, 状态], views: ['02']}
  '04': {name: Processes, topics: [流程, 活动, 参与者], views: ['03']}
  '05': {name: Rules, topics: [校验, 约束, 策略, 异常], views: ['03']}
  '06': {name: Metrics, topics: [指标, 维度, 计算口径, 决策依据], views: ['06']}
  '07': {name: Data Mapping, topics: [表, 字段, SQL依据, 数据血缘], views: ['04']}
  '08': {name: Implementation, topics: [API, 代码, 页面, 权限, 配置, AI接入能力], views: ['05', '07']}
  '09': {name: Dependencies, topics: [上下游业务, 系统依赖], views: ['01', '05']}
  '10': {name: Governance, topics: [证据, 验证, 版本, 冲突, 缺口], views: ['08']}
