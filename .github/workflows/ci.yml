name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  openspec-governance-integration:
    name: governance with OpenSpec 1.13.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install isolated pinned OpenSpec CLI
        run: npm install --prefix "$RUNNER_TEMP/openspec" --no-audit --no-fund @fission-ai/openspec@1.13.0
      - name: verify real CLI and repository evidence lifecycle
        env:
          OPENSPEC_TEST_CLI: ${{ runner.temp }}/openspec/node_modules/@fission-ai/openspec/bin/openspec.js
        run: node --test plugins/team-standards/hooks/tests/governance.test.js

  hooks-test:
    name: hooks tests (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: run hook tests
        working-directory: plugins/team-standards/hooks
        run: npm test

  hook-performance:
    name: hook performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: compare concurrent dispatcher with sequential guards
        working-directory: plugins/team-standards/hooks
        run: npm run test:performance

  agents-sync-check:
    name: AGENTS.md in sync with CLAUDE.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: verify AGENTS.md = transform(CLAUDE.md)
        run: node scripts/sync-agents.js --check

  cross-refs-check:
    name: Cross-skill references resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: validate cross-skill / cross-section references
        run: node scripts/check-cross-refs.js

  version-sync-check:
    name: Plugin manifest versions in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: verify .claude-plugin / .codex-plugin / marketplace versions
        run: node scripts/check-version-sync.js --verbose
      - name: require a version bump for runtime payload changes
        run: node scripts/check-runtime-version-bump.js --base "${{ github.event.pull_request.base.sha || 'HEAD^' }}" --target HEAD

  audit-skills-check:
    name: SKILL.md health (size / description / refs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: audit skills (fail on warnings)
        run: node scripts/audit-skills.js --warnings --ci

  graphify-freshness-check:
    name: Graphify source fingerprint is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: verify Graphify was refreshed after source changes
        run: node scripts/check-graphify-freshness.mjs
