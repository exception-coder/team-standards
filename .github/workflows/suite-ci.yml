name: team-tools-suite

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  release-dry-run:
    name: Validate three plugins and two MCP knowledge domains
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check private repository credential
        shell: bash
        env:
          TEAM_TOOLS_READ_TOKEN: ${{ secrets.TEAM_TOOLS_READ_TOKEN }}
        run: |
          if [[ -z "$TEAM_TOOLS_READ_TOKEN" ]]; then
            echo "::error::Configure TEAM_TOOLS_READ_TOKEN with read access to exception-coder/cross-project-topology."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: team-standards
      - uses: actions/checkout@v4
        with:
          repository: exception-coder/project-coding-profiles
          ref: main
          path: project-coding-profiles
      - uses: actions/checkout@v4
        with:
          repository: exception-coder/yoooni-daily-plugin
          ref: master
          path: yoooni-daily-plugin
      - uses: actions/checkout@v4
        with:
          repository: exception-coder/project-domain-knowledge
          ref: master
          path: project-domain-knowledge
      - uses: actions/checkout@v4
        with:
          repository: exception-coder/cross-project-topology
          ref: master
          path: cross-project-topology
          token: ${{ secrets.TEAM_TOOLS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project-domain-knowledge/package-lock.json
      - run: npm ci
        working-directory: project-domain-knowledge
      - name: Create disposable workspace overview
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { readComponents } from './team-standards/scripts/sync-workspace-overview.mjs';
          const components = readComponents(process.cwd());
          const domain = JSON.parse(fs.readFileSync('project-domain-knowledge/package.json', 'utf8'));
          const rows = [...components, { name: 'project-domain-knowledge', version: domain.version }]
            .map(({ name, version }) => `| \`${name}\` | \`${version}\` |`).join('\n');
          const total = components.reduce((sum, item) => sum + item.skills, 0);
          const counts = components.map(({ name, skills }) => `\`${name}\` ${skills} 个`).join('、');
          fs.writeFileSync('README.md', `# CI workspace\n\n| 组件 | 版本 |\n|---|---|\n${rows}\n\n公共层合计 **${total} 个 Skill**：${counts}。\n`, { flag: 'wx' });
          NODE
      - name: Run suite release validation
        run: >-
          node team-standards/scripts/release-team-tools.mjs
          --workspace "$GITHUB_WORKSPACE"
          --out "$RUNNER_TEMP/team-tools-release"
